# SPA principal — ispdesk.adilsondev.com.br
server {
    listen 80;
    server_name ispdesk.adilsondev.com.br _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Landing page — www.ispdesk.adilsondev.com.br
server {
    listen 80;
    server_name www.ispdesk.adilsondev.com.br;
    root /usr/share/nginx/html/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript;

    location = /privacidade { try_files /privacidade.html =404; }
    location = /termos      { try_files /termos.html =404; }
    location /              { try_files $uri /index.html; }
}
