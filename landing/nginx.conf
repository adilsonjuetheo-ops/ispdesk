server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript text/html;

    location = /privacidade { try_files /privacidade.html =404; }
    location = /termos      { try_files /termos.html =404; }
    location /              { try_files $uri /index.html; }
}
